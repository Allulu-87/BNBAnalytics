<body>

<script>
/* Boot recorder — must run before any other script so it can catch their load
   failures. Opening this app from a phone's storage is exactly the case where a
   relative asset silently fails to load, so record what happened and let
   app.js report it instead of spinning forever. */
window.__BOOT = { stage: 'html', errors: [], failedAssets: [] };
window.addEventListener('error', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
    var url = t.src || t.href || '';
    window.__BOOT.failedAssets.push(url.split('/').pop() || t.tagName);
  } else if (e.message) {
    window.__BOOT.errors.push(e.message +
      (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
  }
}, true);
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  window.__BOOT.errors.push('unhandled: ' + ((r && r.message) || String(r)));
});

/* Last-resort net: if app.js never even ran, its own watchdog can't fire. */
setTimeout(function () {
  if (window.__BOOT.stage !== 'html') return;   // boot took over; nothing to do
  var s = document.getElementById('splash');
  if (!s) return;
  var failed = window.__BOOT.failedAssets;
  s.setAttribute('style', 'position:fixed;inset:0;z-index:100;overflow:auto;padding:1.25rem;' +
    'background:#0d0d0d;color:#e8e8e4;font:13px/1.6 system-ui,-apple-system,sans-serif');
  s.innerHTML = '<h2 style="margin:0 0 .5rem;font-size:1.05rem">The app’s files did not load</h2>' +
    '<p style="color:#b9b8b0;max-width:40rem">This browser did not load the scripts stored next to ' +
    'index.html, so the app never started. Phone browsers normally refuse to read a folder of local ' +
    'files. Put the folder on a web host, or serve it over http://, and open that address instead.</p>' +
    '<pre style="background:#1a1a19;border:1px solid rgba(255,255,255,.15);border-radius:8px;' +
    'padding:.6rem;white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace">' +
    'address : ' + location.protocol + '\nfailed  : ' +
    (failed.length ? failed.join(', ') : '(no load errors reported — scripts were blocked silently)') +
    '\nagent   : ' + navigator.userAgent + '</pre>';
}, 15000);
</script>

<!-- Mirrors the Android launch screen (icon + manifest name) so there is no
     visible change when the OS splash hands over to the page. -->
<div id="splash">
  <div class="inner">
    <svg class="splash-mark" width="76" height="76" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--series-1)"/>
      <path d="M6 16.5V12m4 4.5V8.5m4 8V11m4 5.5V6.5" stroke="#fff" stroke-width="2.1"
            stroke-linecap="round"/>
    </svg>
    <div class="splash-name">BNB Analytics by Allulu</div>
    <div class="spinner" role="progressbar" aria-label="Loading"></div>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--series-1)"/>
      <path d="M6 16.5V12m4 4.5V8.5m4 8V11m4 5.5V6.5" stroke="#fff" stroke-width="2.1"
            stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <h1>BNB Analytics</h1>
      <div class="sub" id="storage-mode">Loading…</div>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-icon" id="theme-toggle" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.7"/>
    </svg>
  </button>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>

<main id="main">
  <div id="filterbar-host"></div>
</main>

<div class="toast-host" id="toasts" aria-live="polite"></div>

     file so the app also works when index.html is opened directly (fetching a
     .wasm from file:// is blocked by CORS). -->

<!-- flatpickr 4.6.13 (MIT) — UMD build, so it works as a classic script -->

<script src="assets/js/analytics.js"></script>

<script>
// Offline support. Only meaningful over http(s) — harmless to skip on file://.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline is optional */ });
  });
}
</script>
